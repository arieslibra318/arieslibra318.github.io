<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地產大亨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Serif+TC:wght@700;900&family=VT323&display=swap">
<style>
/* 版面：全螢幕 3D 大富翁棋盤（台北 1980s，48 格、河岸機場港口）＋報紙米黃 HUD、LED 房市看板、權狀卡、拍賣板、代碼連線 */
:root{
  --paper:#f6eedb; --paper-2:#eadfc4; --ink:#2b2622; --ink-soft:#6b6155;
  --up:#d7263d; --down:#14965a; --led:#ffb000; --board:#15110d;
  --accent:#c8402f; --gold:#e3a52b; --teal:#2b7f86; --shadow:rgba(30,20,10,.3);
  --f-ui:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-news:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-led:'VT323',ui-monospace,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
input,select,textarea{-webkit-user-select:text;user-select:text;touch-action:manipulation}
.nstat{margin:8px 0 0;font-size:14px;line-height:1.5;min-height:1.5em}
.nstat.err{color:var(--accent);font-weight:700}
.share{display:flex;gap:6px;margin:8px 0 0}
.share input{flex:1;min-width:0;font:inherit;font-size:13px;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;background:#fffdf5}
html,body{height:100%;margin:0;background:#cdb88f;color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#c.drag{cursor:grabbing}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.paper{background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink),0 10px 24px var(--shadow)}
.btn{border:2.5px solid var(--ink);background:var(--paper);border-radius:10px;padding:7px 16px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--accent);color:#fff}
.btn.sm{font-size:13px;padding:3px 10px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.up{color:var(--up)}.down{color:var(--down)}
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}

/* 玩家卡 */
#tl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px;max-width:min(42vw,300px)}
.pc{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;padding:5px 12px 5px 5px;border-radius:12px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);position:relative;transition:transform .2s}
.pc canvas{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#e9d9b4}
.pc b{font-size:15px;display:flex;gap:6px;align-items:center}
.pc b i{font-style:normal;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--ink);flex:none}
.pc small{display:block;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small em{font-style:normal;color:var(--ink);font-weight:700}
.pc .deeds{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.pc .deeds span{width:9px;height:12px;border:1.5px solid var(--ink);border-radius:2px}
.pc .deeds span.m{opacity:.35}
.pc.on{background:#fff6dc;transform:translateX(6px)}
.pc.on::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:9px solid var(--accent)}
.pc.out{opacity:.45;filter:grayscale(1)}
.pc b .rv{font-size:10px;font-weight:400;background:#2b7f86;color:#fff;border-radius:6px;padding:0 5px}
.pc .tag{position:absolute;right:-6px;top:-8px;font-size:11px;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 6px}

/* LED 房市看板 */
#ticker{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--board);color:var(--led);border:2.5px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:4px 14px 2px;font-family:var(--f-led);font-size:26px;display:flex;gap:10px;align-items:center;white-space:nowrap;line-height:1}
#ticker .k{font-family:var(--f-ui);font-size:12px;color:#c9b48a}
#ticker .ph{font-family:var(--f-ui);font-size:12px;padding:2px 8px;border-radius:6px;background:#3a2f22;color:#f6eedb}
#ticker .wx{font-family:var(--f-ui);font-size:12px;padding:2px 8px;border-radius:6px;background:#2b3a55;color:#e8f0ff}
#tkChg.upc{color:#ff5a6a}#tkChg.dnc{color:#3ddc8a}
#tr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:7px}
.ib{width:46px;height:46px;border-radius:12px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;position:relative;font-size:11px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:25px;height:25px}
.ib.on{background:var(--gold)}
.ib.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;background:var(--accent);transform:rotate(-40deg)}
.ib b{position:absolute;bottom:2px;font-size:10px;font-weight:400}

#toasts{position:absolute;left:50%;top:calc(100px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4}
.toast{padding:7px 16px;font-size:14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);animation:tin .3s ease-out,tout .4s ease-in 2.8s forwards;max-width:calc(100vw - 32px);text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* 對話框 */
#dialog{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(640px,calc(100vw - 210px));display:flex;gap:12px;padding:12px 16px 12px 12px;cursor:pointer;z-index:3}
#dlgP{width:64px;height:64px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:#e9d9b4}
#dlgBody{flex:1;min-width:0}
#dlgName{display:inline-block;font-size:13px;background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:6px;margin-bottom:4px}
#dlgText{font-size:17px;line-height:1.55;min-height:1.6em}
#dlgText b{color:var(--accent)}
#dlgNext{position:absolute;right:16px;bottom:10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--accent);animation:nb .8s infinite}
@keyframes nb{50%{transform:translateY(4px)}}
#dlgCh{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#dlgCh button{text-align:left;border:2.5px solid var(--ink);background:#fff;border-radius:10px;padding:7px 14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
#dlgCh button.pri{background:var(--accent);color:#fff}
#dlgCh button:hover:not(:disabled){filter:brightness(.96)}

/* 右下按鈕 */
#tbtns{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(48px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;z-index:3}
.tb{width:62px;height:62px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px;padding:0;line-height:1.1}
.tb:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tb.big{width:82px;height:82px;background:var(--accent);color:#fff;font-size:18px}
.tb.big.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--ink),0 0 0 8px rgba(200,64,47,.25)}}
.tb small{display:block;font-size:10px;opacity:.8}

#marquee{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--board);border-top:2.5px solid var(--ink);overflow:hidden;height:calc(34px + env(safe-area-inset-bottom,0px));pointer-events:none}
#mqIn{position:absolute;left:0;top:4px;white-space:nowrap;font-family:var(--f-led);font-size:24px;color:var(--led);will-change:transform}
#mqIn span{margin-right:40px}
#mqIn span i{font-style:normal;color:#ff5a6a}#mqIn span u{text-decoration:none;color:#3ddc8a}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-size:12px;padding:1px 8px;border:2px solid var(--ink);border-radius:6px;white-space:nowrap;pointer-events:none;will-change:transform;color:#fff;font-weight:700}
.fly{position:absolute;left:0;top:0;font-family:var(--f-led);font-size:30px;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 var(--ink),0 0 2px var(--ink);animation:fly 1.6s ease-out forwards}
.fly.p{color:#7dff9e}.fly.n{color:#ff6b6b}
@keyframes fly{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-70px}}
#tip{position:absolute;left:0;top:0;font-size:13px;padding:3px 10px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;pointer-events:none;white-space:nowrap;z-index:2}

/* 標題 */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#logo{font-family:var(--f-news);font-weight:900;font-size:clamp(54px,13vw,120px);line-height:1;color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:.06em}
#logo span{color:var(--up)}
#logoSub{display:inline-block;background:var(--board);color:var(--led);font-family:var(--f-led);font-size:clamp(20px,4vw,30px);padding:2px 16px;border:2.5px solid var(--ink);border-radius:8px}
#logoZh{font-size:clamp(16px,3.6vw,22px);color:#fff;text-shadow:0 2px 0 var(--ink),0 0 8px rgba(0,0,0,.5);letter-spacing:.1em}
#titleBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#titleBtns .btn{font-size:19px;padding:10px 24px}
#titleNote{font-size:13px;color:#fff;max-width:560px;line-height:1.6;background:rgba(43,38,34,.68);padding:8px 14px;border-radius:10px}

/* 視窗 */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,20,10,.4);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:10}
.box{width:min(760px,100%);max-height:min(88vh,800px);display:flex;flex-direction:column;overflow:hidden}
.box.sm{width:min(440px,100%)}
.bh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2.5px solid var(--ink);background:var(--paper-2)}
.bh h3{margin:0;font-size:18px;flex:1}
.bh .x{width:36px;height:36px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;font-size:20px;padding:0}
.bb{overflow:auto;padding:12px 14px 16px;background:#fffaf0;flex:1;min-height:0}
.bf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px;border-top:2.5px solid var(--ink);background:var(--paper-2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:4px 12px;font-size:14px}
.tab.on{background:var(--ink);color:var(--paper)}
table.q{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.q th{font-size:12px;color:var(--ink-soft);text-align:right;font-weight:400;padding:4px 6px;border-bottom:2px solid var(--ink)}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q td{padding:7px 6px;border-bottom:1.5px dashed #d8c9a8;text-align:right;white-space:nowrap}
table.q.lt th:nth-child(2),table.q.lt td:nth-child(2){text-align:left}
table.q td .sec{display:block;font-size:11px;color:var(--ink-soft)}
.tw{overflow-x:auto}
.gdot{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);border-radius:3px;margin-right:6px;vertical-align:-1px}
.acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.need{background:#fde2dc;border:2px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:15px}
.note{font-size:13px;color:var(--ink-soft);line-height:1.6}

/* 權狀 */
.deed{border:2.5px solid var(--ink);border-radius:8px;background:#fffdf5;overflow:hidden;font-variant-numeric:tabular-nums}
.deed .dh{padding:10px 12px;color:#fff;text-align:center;border-bottom:2.5px solid var(--ink)}
.deed .dh small{display:block;font-size:12px;letter-spacing:.3em;opacity:.9}
.deed .dh b{display:block;font-family:var(--f-news);font-size:26px;letter-spacing:.06em}
.deed .db{padding:10px 14px;font-size:14px}
.deed .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #e3d6b8}
.deed .row.cur{background:#fff1c9;font-weight:700}
.deed .stamp{display:inline-block;border:2.5px solid var(--up);color:var(--up);border-radius:6px;padding:0 8px;font-weight:700;transform:rotate(-6deg)}
.deed .own{margin-top:8px;display:flex;align-items:center;gap:8px}

/* 卡片、號外 */
.card{border:2.5px solid var(--ink);border-radius:12px;background:#fffdf5;padding:16px 18px;text-align:center}
.card .ck{font-family:var(--f-news);font-weight:900;font-size:30px;letter-spacing:.2em}
.card .ct{font-family:var(--f-news);font-weight:900;font-size:22px;margin:8px 0 6px;line-height:1.4}
.card p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.news{font-family:var(--f-news)}
.news .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:4px}
.news .mast b{font-size:30px;color:var(--up);font-weight:900}
.news h2{font-size:clamp(24px,5vw,34px);margin:10px 0;line-height:1.3}
.seat{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:2px solid var(--ink);border-radius:10px;background:#fff;margin-bottom:8px}
.seat canvas{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink)}
.seat input{width:100%;min-width:0;box-sizing:border-box;font:inherit;font-size:15px;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;background:#fffdf5}
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font-size:13px;border-right:2px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.offer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.offer input{width:90px;font:inherit;font-size:16px;border:2px solid var(--ink);border-radius:8px;padding:3px 8px;text-align:right}
.spark{width:100%;height:90px;display:block}


/* 狀態列、拍賣板、線上 */
#stat{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 14px;font-size:13px;white-space:nowrap;z-index:2;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#stat i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--led);margin-right:6px;animation:nb .9s infinite}
#auc{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(380px,calc(100vw - 130px));padding:8px 12px 10px;z-index:3}
#auc .ah{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft)}
#auc .ah b{font-family:var(--f-news);font-size:16px;color:var(--accent)}
#auc .an{font-family:var(--f-news);font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px;margin:2px 0}
#auc .ap{display:flex;align-items:baseline;gap:10px;background:var(--board);color:var(--led);border-radius:8px;padding:2px 10px;border:2px solid var(--ink)}
#auc .ap b{font-family:var(--f-led);font-size:34px;line-height:1}
#auc .ap span{font-size:13px;color:#f6eedb}
#auc .bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
#auc .bd span{font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:#fff}
#auc .bd span.x{opacity:.4;text-decoration:line-through}
#auc .bd span.l{background:var(--gold)}
#dlgCh select{font:inherit;font-size:15px;border:2.5px solid var(--ink);border-radius:10px;padding:6px 8px;background:#fffdf5;max-width:100%;flex-basis:100%}
.ib.net{width:auto;padding:0 10px;font-size:12px;line-height:1.15;text-align:center;background:var(--board);color:var(--led)}
.ib.net b{position:static;display:block;font-family:var(--f-led);font-size:20px;font-weight:400;letter-spacing:.08em}
.code{font-family:var(--f-led);font-size:56px;letter-spacing:.18em;background:var(--board);color:var(--led);border:2.5px solid var(--ink);border-radius:10px;padding:0 16px;display:inline-block;line-height:1.1}
.codein{font-family:var(--f-led);font-size:34px;letter-spacing:.2em;width:7.2em;text-transform:uppercase;border:2.5px solid var(--ink);border-radius:10px;padding:2px 10px;background:#fffdf5;text-align:center}
.nm{font:inherit;font-size:16px;border:2.5px solid var(--ink);border-radius:10px;padding:5px 10px;background:#fffdf5;width:10em}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;border:2px solid var(--ink);background:#fff}
.pill.ok{background:#d9f2df}.pill.wait{background:#fff1c9}.pill.off{background:#f3d3cd}
.fxl{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:var(--ink);color:var(--paper);margin:2px 4px 2px 0}

/* 市政府委託 */
#jobs{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:196px;padding:8px 11px 6px;font-size:13px;z-index:2;line-height:1.45}
#jobs h4{margin:0 0 3px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
#jobs .jb{border-top:1.5px dashed #d8c9a8;padding:4px 0}
#jobs .jb b{color:var(--accent)}
#jobs .jb small{color:var(--ink-soft)}
#bJobs{display:none}
#bJobs i{position:absolute;right:-5px;top:-6px;font-style:normal;font-size:11px;background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:999px;min-width:18px;height:18px;line-height:14px;text-align:center}
ul.era{margin:6px 0 0;padding-left:20px;font-family:var(--f-ui);font-size:15px;line-height:1.7}
ul.era li{margin:2px 0}
.bizl{background:#fff6dc;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;margin-bottom:10px;font-size:14px}
@media (max-width:1099px){#jobs{display:none!important}#bJobs{display:grid}}
@media (max-width:760px){
  #tl{max-width:none;right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .pc{grid-template-columns:30px minmax(0,1fr);padding:3px 8px 3px 3px;gap:5px;box-shadow:0 2px 0 var(--ink)}
  .pc .nw{display:none}
  .pc canvas{width:30px;height:30px}
  .pc b{font-size:13px}.pc small{font-size:11px}.pc .deeds{display:none}
  .pc.on{transform:none;background:var(--gold)}.pc.on::before{display:none}
  #ticker{top:calc(98px + env(safe-area-inset-top,0px));font-size:20px;padding:3px 10px 1px;gap:6px}
  #ticker .wx{display:none}

/* ---------- 棋盤幾何：每邊 12 格 ---------- */
const TW=2.6,TD=4,CS=4;
const HALF=(CS*2+(SIDE-1)*TW)/2; // 18.3
// 支線：從主線中段斜穿公園，每條 6 格
const BRF={};
BR.forEach((b,bi)=>{const IN=HALF-TD,A=bi===0?[0,IN]:[0,-IN],B=bi===0?[-IN,0]:[IN,0];const L=Math.hypot(B[0]-A[0],B[1]-A[1]),u=[(B[0]-A[0])/L,(B[1]-A[1])/L];Object.assign(b,{A,B,L,u});
  const n=b.tiles.length,d0=3.6,step=(L-2*d0)/(n-1);b.tiles.forEach((ti,k)=>{const d=d0+k*step;BRF[ti]={x:A[0]+u[0]*d,z:A[1]+u[1]*d,ry:Math.atan2(-u[1],u[0]),w:TW,d:TD,corner:false,side:-1,br:bi};});});
function tileFrame(i){
  if(i>=N)return BRF[i];
  const side=Math.floor(i/SIDE),k=i%SIDE;
  if(k===0){const c=HALF-CS/2;const P=[[c,c],[-c,c],[-c,-c],[c,-c]][side];return{x:P[0],z:P[1],ry:[0,-Math.PI/2,Math.PI,Math.PI/2][side],w:CS,d:CS,corner:true,side};}
  const a=HALF-CS-TW*(k-0.5),b=HALF-TD/2;
  const P=[[a,b],[-b,a],[-a,-b],[b,-a]][side];
  return{x:P[0],z:P[1],ry:[0,-Math.PI/2,Math.PI,Math.PI/2][side],w:TW,d:TD,corner:false,side};
}
const MOVE_RY=[-Math.PI/2,Math.PI,Math.PI/2,0];
const sideOf=i=>Math.floor(((i%N)+N)%N/SIDE);
function faceRy(pos,dir){if(pos>=N){const u=BR[BRF[pos].br].u;return Math.atan2(u[0],u[1])+(dir<0?Math.PI:0);}return MOVE_RY[sideOf(pos)]+(dir<0?Math.PI:0);}
function local(i,lx,lz,y=0.75){const f=tileFrame(i),c=Math.cos(f.ry),s=Math.sin(f.ry);return new V3(f.x+lx*c+lz*s,y,f.z-lx*s+lz*c);}

const camS={yaw:0.35,pitch:0.92,dist:34,tx:0,ty:0.8,tz:0,goal:new V3(0,0.8,0),auto:0};
function updateCam(dt){
  const k=1-Math.pow(0.02,dt);camS.tx+=(camS.goal.x-camS.tx)*k;camS.ty+=(camS.goal.y-camS.ty)*k;camS.tz+=(camS.goal.z-camS.tz)*k;
  if(camS.auto)camS.yaw+=dt*camS.auto;
  const cp=Math.cos(camS.pitch),sp=Math.sin(camS.pitch),dd=camS.dist*(cam.aspect<0.8?1.3:1);
  cam.position.set(camS.tx+Math.sin(camS.yaw)*cp*dd,camS.ty+sp*dd,camS.tz+Math.cos(camS.yaw)*cp*dd);cam.lookAt(camS.tx,camS.ty,camS.tz);
}

function debtOf(p){return G.tiles.reduce((a,s)=>a+(s.o===p.id?(s.d||0):0),0);}
function doLoan(p,i){const v=loanMax(i);G.tiles[i].d=v;p.cash+=v;fly(p,v);snd('coin');drawTile(i);addNews(`${p.name}拿${T[i].n}向銀行貸款 ${fm(v)} 萬`);refresh();}

const ownsGroup=(pid,g)=>groupIdx(g).every(i=>G.tiles[i].o===pid);
function countType(pid,type){return T.reduce((a,t,i)=>a+(t.t===type&&G.tiles[i].o===pid?1:0),0);}
function tileCol(i){const t=T[i];return t.g?GROUPS[t.g].col:t.t==='rail'?'#2b2622':t.t==='air'?'#5f6f78':'#9aa3a8';}
function fxMul(i){let m=1;for(const f of fxOf(i)){if(f.k==='fest'||f.k==='tour')m*=2;else if(f.k==='flood')m*=0.5;else if(f.k==='strike')m=0;else if(f.k==='epi')m*=T[i].t==='air'?0:(f.m||0.5);}return m;}
const epidemic=()=>!!(G&&G.fx&&G.fx.some(f=>f.k==='epi'));
function rentOf(i,dice){const t=T[i],st=G.tiles[i];let r=0;
  if(t.t==='prop'){r=rentLv(t,st.l);if(ownsGroup(st.o,t.g))r*=GROUP_BONUS;r*=(G.gm[t.g]||1);if(G.era>=1&&G.mrt&&G.mrt.includes(i))r*=1.5;}
  else if(t.t==='rail')r=RAIL_R[countType(st.o,'rail')-1]||0;
  else if(t.t==='air')r=AIR_R[countType(st.o,'air')-1]||0;
  else if(t.t==='util')r=(dice||7)*(UTIL_X[countType(st.o,'util')-1]||4);
  return Math.round(r*G.idx/100*fxMul(i));}
function bVal(i){const t=T[i],l=G.tiles[i].l;return t.t==='prop'?(l+(l>5?2:0))*GROUPS[t.g].hc:0;}
function netWorth(p){let v=p.cash;T.forEach((t,i)=>{const st=G.tiles[i];if(st.o!==p.id)return;v+=st.m?priceOf(i)-redeemCost(i):priceOf(i);v+=bVal(i)*0.5-(st.d||0);});return Math.round(v);}
function liquid(p){let v=p.cash;T.forEach((t,i)=>{const st=G.tiles[i];if(st.o!==p.id)return;v+=bVal(i)/2;v+=Math.max(0,sellVal(i));});return v;}

let AC=null,sndOn=true;
function snd(type){if(!sndOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const tone=(f,d,w='square',v=0.05,at=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(0.0001,t+at+d);o.connect(g);g.connect(AC.destination);o.start(t+at);o.stop(t+at+d);};
  if(type==='dice')for(let k=0;k<6;k++)tone(180+rnd()*200,0.04,'triangle',0.06,k*0.06);
  if(type==='step')tone(520,0.05,'triangle',0.03);
  if(type==='coin'){tone(988,0.08,'square',0.04);tone(1319,0.18,'square',0.04,0.08);}
  if(type==='pay'){tone(330,0.12,'sawtooth',0.04);tone(247,0.2,'sawtooth',0.04,0.1);}
  if(type==='build'){tone(196,0.1,'square',0.06);tone(262,0.1,'square',0.05,0.1);tone(392,0.2,'square',0.05,0.2);}
  if(type==='jail'){tone(220,0.3,'sawtooth',0.05);tone(165,0.4,'sawtooth',0.05,0.25);}
  if(type==='card'){tone(660,0.06,'triangle',0.05);tone(880,0.12,'triangle',0.05,0.07);}
  if(type==='bid'){tone(784,0.07,'square',0.04);tone(1046,0.1,'square',0.04,0.07);}
}catch(e){}}

let dlgRes=null,dlgTimer=0,lastSel=null;
function talk(who,text,choices,o={}){
  if(!o.local)bcast({k:'t',w:who&&who.id!=null?who.id:-1,x:text,ms:o.ms||1500});
  return talkShow(who,text,choices,o);}
function talkShow(who,text,choices,o={}){

    const W=who&&who.name?who:{name:'旁白',look:'narr'};$('#dlgName').textContent=W.name;drawFace($('#dlgP'),W.look||'narr');$('#dlgText').innerHTML=text;

    if(choices){let sel=null;
      if(o.sel&&o.sel.length){sel=el('select');sel.id='dlgSel';sel.setAttribute('aria-label','選擇');o.sel.forEach(v=>{const op=el('option');op.value=v;op.textContent=selLabel(v,o.sk);sel.appendChild(op);});if(o.selDef!=null)sel.value=o.selDef;else if(o.sk==='num')sel.value=7;sel.addEventListener('click',e=>e.stopPropagation());ch.appendChild(sel);}
      choices.forEach((c,k)=>{const b=el('button',c.pri?'pri':'',c.t);b.type='button';if(c.dis)b.disabled=true;b.onclick=ev=>{ev.stopPropagation();lastSel=sel?+sel.value:null;dlgRes=null;res(k);};ch.appendChild(b);});
      dlgRes=null;setTimeout(()=>{const b=ch.querySelector('button:not(:disabled)');b&&b.focus();},30);}
    else{dlgRes=()=>{dlgRes=null;clearTimeout(dlgTimer);res();};dlgTimer=setTimeout(()=>dlgRes&&dlgRes(),(o.ms||1500)/spd());}
  });}

function hideTalk(){$('#dialog').hidden=true;$('#dlgCh').innerHTML='';dlgRes=null;clearTimeout(dlgTimer);}
function selLabel(j,k){const t=T[j],st=G.tiles[j];if(!t)return'';
  if(k==='num')return `${j} 點`;
  if(k==='build'||k==='buildfree')return `${t.n} → ${LV[Math.min(6,st.l+1)]}${k==='build'?`（${fm(buildCost(j)/2)} 萬）`:''}`;
  if(k==='buy90')return `${t.n}・${GROUPS[t.g].name}（${fm(Math.round(priceOf(j)*0.9))} 萬）`;
  if(!BUYABLE(t))return t.n;if(st.o<0)return `${t.n}（沒人買 · ${fm(priceOf(j))} 萬）`;const o=G.players[st.o];return `${t.n}（${o?o.name:''}${st.l?' · '+LV[st.l]:''}）`;}
// 由真人（本機或線上）決定的選擇
async function ask(p,who,text,ch,o={}){
  if(isAI(p))return o.def!=null?o.def:ch.length-1;
  if(p.net)return netAsk(p,who,text,ch,o);
  const k=await talk(who,text,ch,o);o.v=lastSel;hideTalk();return k;}
function netAsk(p,who,text,ch,o){
  return new Promise(res=>{
    const id=++G.askId;
    G.ask={id,pid:p.id,w:who&&who.id!=null?who.id:-1,x:text,c:ch.map(c=>({t:c.t,p:c.pri?1:0,d:c.dis?1:0})),s:o.sel||null,sk:o.sk||''};
    NET.askRes=(k,v)=>{if(!(k>=0&&k<ch.length)||ch[k].dis)return;if(o.sel&&k!==(o.def!=null?o.def:ch.length-1)&&!o.sel.includes(v))return;
      G.ask=null;NET.askRes=null;NET.askDef=null;o.v=v;renderStat();push(true);res(k);};
    NET.askDef=()=>{const k=o.def!=null?o.def:ch.length-1;G.ask=null;NET.askRes=null;NET.askDef=null;o.v=null;renderStat();push(true);res(k);};
    renderStat();push(true);
  });}

async function rollDice(vals){
  snd('dice');if(!vals){vals=[1+(rnd()*6|0),1+(rnd()*6|0)];bcast({k:'d',a:vals[0],b:vals[1]});}
  const base=new V3(camS.tx*0.3,0,camS.tz*0.3+1.5);
  const st=dice.map((d,k)=>{const p1=new V3(base.x-0.7+k*1.4+rr(-.3,.3),1.08,base.z+1.8+rr(-.3,.3));const r=Math.hypot(p1.x,p1.z);if(r<3.4){if(r<0.01)p1.z=3.4;else{p1.x*=3.4/r;p1.z*=3.4/r;}}if(p1.z<-4.1&&p1.z>-6.7&&Math.abs(p1.x)<2.7)p1.z=-3.8;
    return{p0:new V3(p1.x-0.8+k*1.6,6,p1.z+0.4),p1,q0:new THREE.Quaternion().setFromEuler(new THREE.Euler(rr(0,6),rr(0,6),rr(0,6))),spin:new V3(rr(8,14),rr(6,12),rr(8,14)),qf:new THREE.Quaternion().setFromEuler(new THREE.Euler(0,rr(0,6.28),0)).multiply(BASEQ[vals[k]])};});
  await tween(0.95,k=>{dice.forEach((d,i)=>{const s=st[i];const e=Math.min(1,k);d.position.lerpVectors(s.p0,s.p1,e);d.position.y=s.p1.y+(s.p0.y-s.p1.y)*Math.pow(1-e,2)+Math.abs(Math.sin(e*Math.PI*2.5))*(1-e)*1.4;
    if(k<0.78){d.quaternion.copy(s.q0);d.rotateX(s.spin.x*k);d.rotateY(s.spin.y*k);d.rotateZ(s.spin.z*k);}else{const cur=d.quaternion.clone();d.quaternion.copy(cur).slerp(s.qf,(k-0.78)/0.22);}});});
  dice.forEach((d,i)=>d.quaternion.copy(st[i].qf));return vals;
}
function hideDice(){dice.forEach(d=>d.position.y=-5);bcast({k:'hd'});}

/* ---------- 移動 ---------- */
function stepPos(pos,dir){if(pos>=N){const br=brOf(pos),k=br.tiles.indexOf(pos);if(dir>0)return k+1<br.tiles.length?br.tiles[k+1]:br.to;return k>0?br.tiles[k-1]:br.from;}return (pos+dir+N)%N;}
function junctionAt(pos,dir){return pos<N?BR.find(b=>dir>0?b.from===pos:b.to===pos):null;}
function landAfter(pos,dir,k,ent){let q=pos;for(let s=0;s<k;s++)q=(s===0&&ent!=null)?ent:stepPos(q,dir);return q;}
function tileScore(p,j){const t=T[j],st=G.tiles[j];if(BUYABLE(t)){if(st.o<0)return aiWantBuy(p,j)?priceOf(j)*0.3:0;if(st.o!==p.id&&!st.m)return -rentOf(j,7);return 5;}
  return {gojail:-200,tax:-100,park:G.pot,lantern:50,view:40,chance:15,auction:10}[t.t]||0;}
async function chooseBranch(p,br,dir,rem){const ent=dir>0?br.tiles[0]:br.tiles[br.tiles.length-1];let go;
  if(isAI(p)){const a=tileScore(p,landAfter(p.pos,dir,rem,ent)),b=tileScore(p,landAfter(p.pos,dir,rem,null));go=a>b+10||(Math.abs(a-b)<=10&&rnd()<0.5);}
  else go=(await ask(p,null,`岔路口！要轉進<b>${br.n}</b>嗎？${br.desc}（這次還要走 ${rem} 步）`,[{t:`轉進${br.n}`,pri:true},{t:'走主線'}],{def:1}))===0;
  if(go)toast(`${p.name}轉進${br.n}`);return go;}
function aiPickNum(p){let best=7,bs=-1e9;for(let k=2;k<=12;k++){const v=tileScore(p,landAfter(p.pos,p.dir||1,k,null))+rnd();if(v>bs){bs=v;best=k;}}return best;}
async function moveSteps(p,n,noPay,noBranch){
  const t=tokens[p.id];
  for(let s=0;s<Math.abs(n);s++){
    const dir=n>0?1:-1;let nx=null;const jb=noBranch?null:junctionAt(p.pos,dir);
    if(jb&&await chooseBranch(p,jb,dir,Math.abs(n)-s))nx=dir>0?jb.tiles[0]:jb.tiles[jb.tiles.length-1];
    const from=t.position.clone();p.pos=nx!=null?nx:stepPos(p.pos,dir);const to=tokenPos(p);const ry=Math.atan2(to.x-from.x,to.z-from.z);
    snd('step');push();
    await tween(0.2,k=>{t.position.lerpVectors(from,to,k);t.position.y=to.y+Math.sin(k*Math.PI)*0.7;t.rotation.y=ry;});
    focusOn(t.position);
    if(p.pos===0&&!noPay)passGo(p);
  }
}
function passGo(p){const s=salary();p.cash+=s;fly(p,s);snd('coin');toast(`${p.name}經過起點，領薪水 ${s} 萬`);
  if(G.era>=1&&isPoorest(p)){p.cash+=100;setTimeout(()=>fly(p,100),400);toast(`${p.name}是最窮的玩家，領紓困金 100 萬`);}refresh();}
function isPoorest(p){const al=G.players.filter(q=>!q.out).sort((a,b)=>netWorth(a)-netWorth(b));return al.length>1&&al[0]===p&&netWorth(al[al.length-1])>netWorth(p)*1.6;}
async function moveTo(p,target){if(p.pos>=N)await jumpTo(p,brOf(p.pos).to,2,0.6);await moveSteps(p,(target-p.pos+N)%N,false,true);}
async function jumpTo(p,target,h=4,d=0.7){const t=tokens[p.id],from=t.position.clone();p.pos=target;const to=p.jail?jailPos(p):tokenPos(p);push(true);
  await tween(d,k=>{t.position.lerpVectors(from,to,k);t.position.y=to.y+Math.sin(k*Math.PI)*h;});t.rotation.y=faceRy(p.pos,p.dir||1);focusOn(t.position);}
function nextOfType(p,type){const b0=p.pos<N?p.pos:brOf(p.pos).to;for(let k=1;k<=N;k++){const j=(b0+k)%N;if(T[j].t===type)return j;}return p.pos;}

/* ---------- 付款、破產 ---------- */
async function pay(p,amt,to,why){
  amt=Math.max(0,Math.round(amt));if(!amt)return true;
  if(p.cash<amt){const ok=!isAI(p)?await raiseHuman(p,amt,why):aiRaise(p,amt);if(!ok){await bankrupt(p,to);return false;}}
  p.cash-=amt;fly(p,-amt);snd('pay');
  if(to&&to.id!=null){to.cash+=amt;setTimeout(()=>fly(to,amt),300);}else if(to==='pot'){G.pot+=amt;drawTile(PARK);}
  refresh();return true;}
function gain(p,amt){p.cash+=amt;fly(p,amt);snd('coin');refresh();}
function drawSpecials(){T.forEach((t,i)=>{if(t.t==='auction'||t.t==='park')drawTile(i);});}
async function bankrupt(p,to){
  p.out=true;snd('jail');const heir=to&&to.id!=null&&!to.out?to:null;
  T.forEach((t,i)=>{const st=G.tiles[i];if(st.o!==p.id)return;st.l=0;if(heir){st.o=heir.id;}else{st.o=-1;st.m=false;st.d=0;if(!G.fore.includes(i))G.fore.push(i);}drawTile(i);setBuilding(i);});
  if(heir&&p.cash>0)heir.cash+=p.cash;p.cash=0;tokens[p.id].visible=false;labels[p.id].style.display='none';drawSpecials();
  addNews(`${p.name}宣告破產${heir?`，名下地產全部歸 ${heir.name}`:'，地產由銀行收回，送進法拍中心'}。`);refresh();
  await talk(null,`<b>${esc(p.name)}</b> 付不出錢，宣告破產！${heir?`名下地產全部歸 ${esc(heir.name)}。`:'地產由銀行收回，之後在法拍中心拍賣。'}`,null,{ms:2600});
  const alive=G.players.filter(q=>!q.out);if(alive.length<=1||!G.players.some(q=>q.human&&!q.bot&&!q.out))G.over=true;
}

/* ---------- 地產操作 ---------- */
const GROUP_BONUS=1.4; // 集滿整區的過路費倍數
const maxLv=()=>G.era>=2?6:5;
function canBuild(p,i){const t=T[i],st=G.tiles[i];return t.t==='prop'&&st.o===p.id&&!st.m&&st.l<maxLv();}
function canSellB(p,i){const t=T[i],st=G.tiles[i];return t.t==='prop'&&st.o===p.id&&st.l>0;}
function groupBuilt(i){return T[i].t==='prop'&&G.tiles[i].l>0;}
function canMort(p,i){const st=G.tiles[i];return st.o===p.id&&!st.m&&!st.d&&!groupBuilt(i);}
function canSellLand(p,i){const st=G.tiles[i];return st.o===p.id&&!groupBuilt(i);}
function canAuctionOwn(p,i){const st=G.tiles[i];return canSellLand(p,i)&&!st.m&&!st.d&&G.players.some(q=>!q.out&&q!==p);}
function doBuild(p,i,quiet,cost,bonus){const c=cost!=null?cost:buildCost(i);p.cash-=c;if(!bonus){const b=G.bt[p.id];G.bt[p.id]=b&&b.r===G.round?{r:G.round,n:b.n+1}:{r:G.round,n:1};}G.tiles[i].l++;setBuilding(i,true);drawTile(i);snd('build');if(!quiet)toast(`${p.name}在${T[i].n}蓋了${LV[G.tiles[i].l]}`);addNews(`${p.name}在${T[i].n}蓋起${LV[G.tiles[i].l]}`);refresh();}
function doSellB(p,i){const c=GROUPS[T[i].g].hc*(G.tiles[i].l===6?3:1)/2;p.cash+=c;G.tiles[i].l--;setBuilding(i);drawTile(i);refresh();}
function doMort(p,i){G.tiles[i].m=true;p.cash+=mortVal(i);drawTile(i);refresh();}
function doRedeem(p,i){p.cash-=redeemCost(i);G.tiles[i].m=false;drawTile(i);refresh();}
function doSellLand(p,i){const v=sellVal(i);p.cash+=v;G.tiles[i]={o:-1,l:0,m:false};setBuilding(i);drawTile(i);addNews(`${p.name}把${T[i].n}賣回給銀行，進帳 ${fm(v)} 萬`);refresh();}
function transfer(i,from,to,price){to.cash-=price;from.cash+=price;G.tiles[i].o=to.id;setBuilding(i);drawTile(i);addNews(`${to.name}以 ${fm(price)} 萬向${from.name}買下${T[i].n}`);snd('coin');refresh();}
function buyTile(p,i,price){p.cash-=price;G.tiles[i].o=p.id;G.tiles[i].m=false;G.fore=G.fore.filter(j=>j!==i);drawTile(i);setBuilding(i,true);fly(p,-price);snd('coin');drawSpecials();addNews(`${p.name}以 ${fm(price)} 萬買下${T[i].n}`);refresh();
  const t=T[i];if(t.g&&ownsGroup(p.id,t.g))toast(`${p.name}集滿${GROUPS[t.g].name}，整區過路費 ×${GROUP_BONUS}`);}

/* ---------- 競標拍賣 ---------- */
function aiVal(q,i){const t=T[i];let v=priceOf(i)*({builder:1.0,saver:0.8,flipper:G.idx<120?1.15:0.75}[q.ai]||1);
  if(t.g){const others=groupIdx(t.g).filter(j=>j!==i);if(others.every(j=>G.tiles[j].o===q.id))v*=1.8;else if(others.some(j=>G.tiles[j].o===q.id))v*=1.2;
    const opp=others.map(j=>G.tiles[j].o).filter(o=>o>=0&&o!==q.id);if(opp.length===others.length&&new Set(opp).size===1)v*=1.35;}
  else v*=1+0.25*countType(q.id,t.t);
  v*=rr(0.9,1.1);const cap=q.cash-(RES[q.ai]||150)*0.5;return Math.max(0,Math.floor(Math.min(v,cap)/10)*10);}
async function auction(i,start,seller,title){
  const t=T[i],n=G.players.length;
  const bidders=G.players.filter(q=>!q.out&&q!==seller&&q.cash>=start).sort((a,b)=>((a.id-G.cur+n)%n)-((b.id-G.cur+n)%n));
  if(!bidders.length){await talk(null,`${esc(title)}：${esc(t.n)}沒有人出得起底價 ${fm(start)} 萬，流標。`,null,{ms:1400});return null;}
  const val={};bidders.forEach(q=>{if(isAI(q))val[q.id]=aiVal(q,i);});
  let act=bidders.map(q=>q.id),price=start,lead=null,guard=0;
  const upd=()=>{G.auc={i,p:price,l:lead?lead.id:-1,a:act.slice(),b:bidders.map(q=>q.id),t:title,s:seller?seller.id:-1};renderAuc();push();};
  const done=()=>act.length===0||(lead&&act.length===1&&act[0]===lead.id);
  upd();snd('card');
  await talk(null,`<b>${esc(title)}</b>：${esc(t.n)}（市價 ${fm(priceOf(i))} 萬），底價 <b>${fm(start)} 萬</b>，開始競標！`,null,{ms:1500});
  while(!done()&&guard++<300){
    if(act.every(id=>isAI(G.players[id]))){ // 剩下都是電腦：直接用「次高價＋10」結算
      const mins=lead?price+10:price;const arr=act.map(id=>{const q=G.players[id];return{q,v:q===lead?Math.max(val[id]||0,price):(val[id]||0)};}).sort((a,b)=>b.v-a.v);const top=arr[0],sec=arr[1];
      if(top.q===lead){if(sec&&sec.v>=mins)price=Math.min(top.v,sec.v+10);}
      else if(top.v>=mins){price=Math.max(mins,sec?Math.min(top.v,sec.v+10):mins);lead=top.q;}
      act=lead?[lead.id]:[];upd();await sleep(500/spd());break;}
    for(const pid of act.slice()){
      if(done())break;if(!act.includes(pid)||(lead&&lead.id===pid))continue;
      const q=G.players[pid],minBid=lead?price+10:price;let bid=0;
      if(q.cash>=minBid){
        if(isAI(q)){if(val[pid]>=minBid)bid=Math.max(minBid,Math.min(val[pid],lead?price+(rnd()<0.6?10:r10(price*0.1)):minBid));}
        else{const opts=[...new Set([minBid,r10(price+50),r10(price+100)])].filter(v=>v>=minBid);
          const ch=opts.map((v,k)=>({t:`出價 ${fm(v)} 萬`,pri:k===0,dis:q.cash<v})).concat([{t:'放棄'}]);
          const k=await ask(q,null,`<b>${esc(title)}</b>：${esc(t.n)}（市價 ${fm(priceOf(i))} 萬）<br>目前 <b>${fm(price)} 萬</b>${lead?`，${esc(lead.name)}領先`:'，還沒人出價'}。${esc(q.name)}要出價嗎？`,ch,{def:ch.length-1});
          if(k<opts.length&&q.cash>=opts[k])bid=opts[k];}}
      if(bid>=minBid&&bid>0){price=bid;lead=q;snd('bid');upd();if(isAI(q))await talk(q,`${fm(bid)} 萬！`,null,{ms:650});}
      else{act.splice(act.indexOf(pid),1);upd();if(isAI(q))await sleep(250/spd());}
    }
  }
  G.auc=null;renderAuc();
  if(!lead){await talk(null,`${esc(t.n)}沒有人出價，流標。`,null,{ms:1300});refresh();return null;}
  const st=G.tiles[i];lead.cash-=price;fly(lead,-price);if(seller){seller.cash+=price;setTimeout(()=>fly(seller,price),300);}else{st.m=false;st.l=0;}
  st.o=lead.id;G.fore=G.fore.filter(j=>j!==i);drawTile(i);setBuilding(i,true);drawSpecials();snd('coin');addNews(`${lead.name}以 ${fm(price)} 萬標下${t.n}（${title}）`);refresh();
  await talk(lead,`${esc(t.n)}由我以 <b>${fm(price)} 萬</b>得標！`,null,{ms:1500});
  if(t.g&&ownsGroup(lead.id,t.g))toast(`${lead.name}集滿${GROUPS[t.g].name}，整區過路費 ×${GROUP_BONUS}`);
  return lead;}

/* ---------- 併購 ---------- */
function tkPrice(p,i){const st=G.tiles[i];let v=priceOf(i)*(p.mCards?1.1:1.5)+bVal(i)-(st.d||0);if(st.m)v-=redeemCost(i);return Math.max(10,Math.round(v));}
function canTakeover(p,i){const t=T[i],st=G.tiles[i];if(!BUYABLE(t)||st.o<0||st.o===p.id||G.players[st.o].out)return false;if(G.tk[p.id]===G.round||(G.prot[i]||0)>=G.round)return false;
  if(t.g)return groupIdx(t.g).some(j=>j!==i&&G.tiles[j].o===p.id);return countType(p.id,t.t)>0;}
async function takeover(p,i){
  const t=T[i],st=G.tiles[i],own=G.players[st.o],price=tkPrice(p,i),fee=Math.round(price*0.1),def=Math.round(price*0.3);
  if(p.cash<price+fee){toast('現金不夠，併購要付出價加一成手續費');return false;}
  G.tk[p.id]=G.round;const card=p.mCards>0;if(card)p.mCards--;
  await talk(p,`我要<b>併購</b>${esc(own.name)}的${esc(t.n)}！出價 <b>${fm(price)} 萬</b>${card?'（持併購許可，不能反併購）':''}。`,null,{ms:1600});
  let block=false;
  if(!card&&own.cash>=def){
    if(isAI(own)){const key=(t.g&&ownsGroup(own.id,t.g))||st.l>0||(t.g&&groupIdx(t.g).filter(j=>G.tiles[j].o===own.id).length>=2)||(!t.g&&countType(own.id,t.t)>=2);block=key&&own.cash-def>250;}
    else{const k=await ask(own,own,`${esc(p.name)}要用 <b>${fm(price)} 萬</b>併購你的<b>${esc(t.n)}</b>（市價 ${fm(priceOf(i))} 萬）。要花 <b>${fm(def)} 萬</b>反併購嗎？`,[{t:`反併購（−${fm(def)} 萬）`,dis:own.cash<def},{t:`接受，收 ${fm(price)} 萬`,pri:true}],{def:1});block=k===0;}}
  if(block){await pay(own,def,'pot','反併購');const lf=Math.min(p.cash,Math.round(price*0.05));p.cash-=lf;G.pot+=lf;drawTile(PARK);fly(p,-lf);
    addNews(`${own.name}花 ${fm(def)} 萬擋下${p.name}對${t.n}的併購`);refresh();await talk(own,`想併購我的${esc(t.n)}？門都沒有！`,null,{ms:1500});await talk(p,`可惡，白付了 ${fm(lf)} 萬律師費。`,null,{ms:1200});return false;}
  p.cash-=price+fee;own.cash+=price;G.pot+=fee;fly(p,-(price+fee));setTimeout(()=>fly(own,price),300);drawTile(PARK);st.o=p.id;G.prot[i]=G.round+2;setBuilding(i,true);drawTile(i);snd('coin');
  addNews(`${p.name}以 ${fm(price)} 萬併購${own.name}的${t.n}`);refresh();
  await talk(p,`${esc(t.n)}併購成功！手續費 ${fm(fee)} 萬進了廟口紅包。`,null,{ms:1500});
  if(t.g&&ownsGroup(p.id,t.g))toast(`${p.name}集滿${GROUPS[t.g].name}`);return true;}

/* ---------- 機會、命運 ---------- */
function bCount(p){let h=0,b=0;G.tiles.forEach(s=>{if(s.o===p.id){if(s.l>=5)b+=s.l-4;else h+=s.l;}});return[h,b];}
async function goLand(p,j,d){await moveTo(p,j);await landOn(p,d);}
function addFx(k,g,u,m){G.fx=G.fx.filter(f=>!(f.k===k&&f.g===g));const f=g?{k,g,u}:{k,u};if(m)f.m=m;G.fx.push(f);T.forEach((t,i)=>BUYABLE(t)&&drawTile(i));push();}
async function freeBuild(p,half){const cand=T.map((x,j)=>j).filter(j=>canBuild(p,j));if(!cand.length){if(!half){gain(p,50);await talk(p,'沒有可以加蓋的地，建照轉賣得 50 萬。',null,{ms:1300});}return false;}
  let j=-1;const cost=x=>half?buildCost(x)/2:0;
  if(isAI(p)){const c=cand.slice().sort((a,b)=>GROUPS[T[b].g].hc-GROUPS[T[a].g].hc)[0];if(p.cash-cost(c)>100)j=c;}
  else{const o={sel:cand,sk:half?'build':'buildfree',def:1};const k=await ask(p,null,half?'建設公司：可以用<b>半價</b>在你的任一塊地上加蓋一層。':'拿到建築執照：<b>免費</b>在你的任一塊地上加蓋一層。',[{t:half?'半價加蓋':'免費加蓋',pri:true},{t:'不用了'}],o);if(k===0&&cand.includes(o.v))j=o.v;}
  if(j<0||!canBuild(p,j)||p.cash<cost(j)){if(isAI(p))await talk(p,'先不蓋。',null,{ms:800});return false;}
  doBuild(p,j,true,cost(j),true);if(cost(j))fly(p,-cost(j));await talk(p,`${esc(T[j].n)}加蓋成${LV[G.tiles[j].l]}！`,null,{ms:1200});return true;}

 {t:'去西門町看電影',d:'前進到漢中街，經過起點可以領薪水。',f:async(p,d)=>goLand(p,18,d)},

async function drawCard(p,kind,dice){

  const txt=`抽到${kind==='chance'?'機會':'命運'}：<b>${esc(c.t)}</b>　${esc(c.d)}`;
  if(isLocal(p)){bcast({k:'t',w:p.id,x:txt,ms:2400});await cardModal(kind,c);}else await talk(p,txt,null,{ms:isAI(p)?2000:2600});

async function airport(p,i,dice){if(epidemic()){await talk(null,'疫情期間機場停飛，不能搭飛機。',null,{ms:1200});return;}const st=G.tiles[i];const own=st.o>=0&&st.o!==p.id?G.players[st.o]:null;const fare=st.o===p.id?0:Math.round(80*G.idx/100);if(p.cash<fare+50)return;
  const rank=j=>BUYABLE(T[j])&&G.tiles[j].o<0?0:G.tiles[j].o===p.id?1:2;
  const dests=T.map((x,j)=>j).filter(j=>j!==i&&j!==GOJ&&j!==JAIL).sort((a,b)=>rank(a)-rank(b)||((a-i+N)%N)-((b-i+N)%N));let dest=-1;
  if(isAI(p))dest=aiFly(p,fare);
  else{const o={sel:dests,sk:'tile',def:1};const k=await ask(p,null,`要從<b>${esc(T[i].n)}</b>搭飛機嗎？票價 <b>${fare?fm(fare)+' 萬':'免費（自家機場）'}</b>，可以飛到任何一格，但不會經過起點領薪水。`,[{t:'起飛',pri:true},{t:'不用了'}],o);if(k===0)dest=o.v;}
  if(dest==null||!(dest>=0&&dest<NT)||dest===i)return;
  if(fare&&!(await pay(p,fare,own,'機票')))return;
  await talk(p,`搭飛機前往<b>${esc(T[dest].n)}</b>！`,null,{ms:1100});snd('coin');await jumpTo(p,dest,9,1.2);await landOn(p,dice,{noFly:true});}
function aiFly(p,fare){if(rnd()<0.35)return -1;const res=(RES[p.ai]||150)+fare;let best=-1,bs=0;
  T.forEach((t,j)=>{if(t.t!=='prop'||G.tiles[j].o>=0)return;if(p.cash-priceOf(j)<res)return;const others=groupIdx(t.g).filter(x=>x!==j);const sc=others.every(x=>G.tiles[x].o===p.id)?3:others.some(x=>G.tiles[x].o===p.id)?1.5:0;if(sc>bs){bs=sc;best=j;}});
  return bs>=1.5?best:-1;}

async function buildCo(p){
  if(T.some((x,j)=>canBuild(p,j))){await freeBuild(p,true);return;}
  const un=T.map((x,j)=>j).filter(j=>T[j].t==='prop'&&G.tiles[j].o<0);const p90=x=>Math.round(priceOf(x)*0.9);
  if(!un.length){await talk(p,'建設公司今天沒有案子，喝杯茶就走。',null,{ms:1200});return;}

  if(isAI(p)){const c=un.filter(x=>aiWantBuy(p,x,p90(x)));j=c.length?c.sort((a,b)=>aiVal(p,b)-aiVal(p,a))[0]:-1;}

async function stockEx(p){const ph=phase();let amt=0;
  if(isAI(p)){if(p.ai==='flipper')amt=ph==='boom'?200:p.cash>900?100:0;else if(p.ai==='builder')amt=ph==='boom'&&p.cash>700?100:0;}
  else{const k=await ask(p,null,`證券號子：要不要買股票？${ph==='boom'?'現在股市熱，':ph==='bust'?'股市在崩盤，':'股市在高檔震盪，'}漲跌全看運氣。`,[{t:'投資 100 萬',dis:p.cash<100},{t:'投資 200 萬',dis:p.cash<200},{t:'不玩',pri:true}],{def:2});amt=[100,200,0][k]||0;}
  if(!amt||p.cash<amt){await talk(p,'看看就好。',null,{ms:900});return;}

  const m=pick({boom:[0,0.5,1.5,2,2.5,3],peak:[0,0.5,1,1.5,2],bust:[0,0,0.5,1,1.5]}[ph]),win=Math.round(amt*m);

  if(win!==amt)addNews(`${p.name}在號子${win>amt?'賺':'賠'}了 ${fm(Math.abs(win-amt))} 萬`);}

    <div class="own">${own?`<span class="gdot" style="background:${own.col}"></span>業主：<b>${esc(own.name)}</b>${st.l?` · ${LV[st.l]}`:''}${st.m?' <span class="stamp">抵押中</span>':''}`:`<span class="note">還沒有人買${G.fore.includes(i)?'（法拍物件）':''}</span>`}</div></div></div>`;}

    <h4 style="margin:12px 0 4px">最近的新聞</h4>${G.news.map(s=>`<p class="note" style="margin:2px 0">・${esc(s)}</p>`).join('')}`;}
function renderManage(){

  if(rc)body+=`<div class="need">要付 <b>${fm(rc.amt)} 萬</b>（${esc(rc.why)}），現金 ${fm(p.cash)} 萬，${need>0?`還差 <b>${fm(need)} 萬</b>。申請房貸、拆房子、抵押或賣地湊錢。`:'錢夠了，可以付款。'}</div>`;
  const tab=rc&&mgTab==='buy'?'mine':mgTab;
  if(tab==='mine'){const mine=range(NT).filter(i=>G.tiles[i].o===p.id);body+=bizHTML(p);
    if(!mine.length)body+='<p class="note">你還沒有任何地產。停在沒人買的格子就可以買，也可以參加競標。</p>';
    else{body+='<div class="tw"><table class="q"><tr><th>地產</th><th>現況</th><th>地價</th><th>過路費</th><th>操作</th></tr>';
      mine.forEach(i=>{const t=T[i],st=G.tiles[i];
        const a=[];if(false)a.push(`<button class="btn sm pri" data-a="b" data-i="${i}" type="button" ${p.cash<buildCost(i)||rc||!canBuildMore(p)?'disabled':''}>${st.l===5?'升級地標':'加蓋'} −${buildCost(i)}</button>`);
        if(canSellB(p,i))a.push(`<button class="btn sm" data-a="sb" data-i="${i}" type="button">拆賣 +${GROUPS[t.g].hc*(st.l===6?3:1)/2}</button>`);
        if(canMort(p,i))a.push(`<button class="btn sm" data-a="m" data-i="${i}" type="button">抵押 +${mortVal(i)}</button>`);
        if(canLoan(p,i))a.push(`<button class="btn sm" data-a="ln" data-i="${i}" type="button">房貸 +${fm(loanMax(i))}</button>`);
        if(st.d)a.push(`<button class="btn sm" data-a="rp" data-i="${i}" type="button" ${p.cash<st.d||rc?'disabled':''}>還房貸 −${fm(st.d)}</button>`);
        if(st.m)a.push(`<button class="btn sm" data-a="r" data-i="${i}" type="button" ${p.cash<redeemCost(i)||rc?'disabled':''}>贖回 −${redeemCost(i)}</button>`);
        if(canSellLand(p,i)&&sellVal(i)>0)a.push(`<button class="btn sm" data-a="s" data-i="${i}" type="button">賣回銀行 +${fm(sellVal(i))}</button>`);
        if(!rc&&canAuctionOwn(p,i))a.push(`<button class="btn sm" data-a="au" data-i="${i}" type="button">公開拍賣</button>`);
        body+=`<tr><td><span class="gdot" style="background:${tileCol(i)}"></span>${esc(t.n)}<span class="sec">${t.g?GROUPS[t.g].name+(ownsGroup(p.id,t.g)?' · 已集滿':''):TYPE_N[t.t]}${G.mrt.includes(i)&&G.era?' · 捷運站':''}</span></td><td>${st.m?'<span class="up">抵押中</span>':t.t==='prop'?LV[st.l]:'—'}${st.d?`<span class="sec up">房貸 ${fm(st.d)}</span>`:''}</td><td>${fm(priceOf(i))}</td><td>${st.m?'—':fm(rentOf(i,7))}${t.t==='util'?'<span class="sec">以 7 點計</span>':''}</td><td><div class="acts">${a.join('')||'<span class="note">—</span>'}</div></td></tr>`;});
      body+=`</table></div><p class="note"><b>加蓋</b>：停在自己的地上，就可以當場加蓋一層（每次一層）。集滿一整區，整區過路費 ×${GROUP_BONUS}。<br>空地可以<b>抵押</b>（抵押中收不到過路費）；有房子的地可以申請<b>房貸</b>，最多借地價加建物造價的五成，照樣收過路費，但每回合要按利率（現在 ${(G.rate*100).toFixed(1)}%）付息。<br>賣回銀行拿市價${(G.sellR||0.8)<0.8?'七':'八'}成（要先扣掉房貸）；「公開拍賣」由其他玩家喊價，底價市價六成。</p>`;}}
  else if(tab==='buy'){const list=range(NT).filter(i=>{const st=G.tiles[i];return st.o>=0&&st.o!==p.id&&!G.players[st.o].out;});
    const used=G.tk[p.id]===G.round;
    if(!list.length)body+='<p class="note">目前別人手上沒有地。</p>';
    else{body+=`<div class="tw"><table class="q"><tr><th>地產</th><th>業主</th><th>市價</th><th>協商收購（萬）</th><th>強制併購</th></tr>`;
      list.forEach(i=>{const t=T[i],st=G.tiles[i],o=G.players[st.o];const sug=Math.round(priceOf(i)*1.3);
        const offer=groupBuilt(i)?'<span class="note">有建築</span>':`<div class="offer" style="justify-content:flex-end"><input type="number" min="1" step="10" value="${sug}" id="of${i}" aria-label="出價"><button class="btn sm pri" data-a="o" data-i="${i}" type="button">出價</button></div>`;
        const tk=(G.prot[i]||0)>=G.round?'<span class="note">保護期</span>':canTakeover(p,i)?`<button class="btn sm" data-a="tk" data-i="${i}" type="button" ${p.cash<tkPrice(p,i)*1.1?'disabled':''}>併購 ${fm(tkPrice(p,i))}</button>`:'<span class="note">—</span>';
        body+=`<tr><td><span class="gdot" style="background:${tileCol(i)}"></span>${esc(t.n)}<span class="sec">${st.l?LV[st.l]:''}${st.m?' 抵押中':''}</span></td><td>${esc(o.name)}</td><td>${fm(priceOf(i))}</td><td>${offer}</td><td>${tk}</td></tr>`;});

  openModal(`<div class="bh"><h3>${rc?'籌錢付款':'管理地產'} · 現金 ${fm(p.cash)} 萬</h3>${rc?'':'<button class="x" type="button" id="mx" aria-label="關閉">×</button>'}</div><div class="bb">${body}</div><div class="bf">${foot}</div>`);

    $('#mPay').onclick=()=>fin(true);$('#mBk').onclick=()=>fin(false);}
}
async function mgAct(a,i){const p=meP();if(!p)return;
  if(NET.role==='guest'){const d={a,i};if(a==='o'){const v=Math.round(+$('#of'+i).value||0);if(v<=0||v>p.cash){toast(v>p.cash?'現金不夠':'請輸入出價',true);return;}d.v=v;}
    if(a==='o'||a==='tk'||a==='au')closeModal();sendIntent(d);return;}
  if(a==='ln'){if(canLoan(p,i))doLoan(p,i);}else if(a==='rp'){if(!myRaise())doRepay(p,i);}else if(a==='sb')doSellB(p,i);else if(a==='m')doMort(p,i);else if(a==='r')doRedeem(p,i);else if(a==='s')doSellLand(p,i);
  else if(a==='o'||a==='tk'||a==='au'){let v=0;if(a==='o'){v=Math.round(+$('#of'+i).value||0);if(v<=0||v>p.cash){toast(v>p.cash?'現金不夠':'請輸入出價',true);return;}}
    closeModal();const owner=G.players[G.tiles[i].o];
    await busyRun(()=>a==='o'?tradeOffer(p,owner,i,v):a==='tk'?takeover(p,i):auction(i,r10(priceOf(i)*0.6),p,'公開拍賣'));
    if(canManage())renderManage();return;}
  renderManage();}
async function tradeOffer(p,owner,i,v){
  const t=T[i];let ok;
  if(!isAI(owner)){const k=await ask(owner,owner,`${esc(p.name)}想用 <b>${fm(v)} 萬</b>買你的<b>${esc(t.n)}</b>（市價 ${fm(priceOf(i))} 萬）。${esc(owner.name)}，你同意嗎？`,[{t:'同意',pri:true},{t:'不同意'}],{def:1});ok=k===0;if(!ok)await talk(owner,'不賣。',null,{ms:900});}
  else{let need=priceOf(i)*1.3;if(t.g){const gi=groupIdx(t.g);const theirs=gi.filter(j=>G.tiles[j].o===owner.id).length;if(theirs===gi.length)need=priceOf(i)*3;else if(theirs===gi.length-1)need*=1.4;if(gi.filter(j=>G.tiles[j].o===p.id).length===gi.length-1)need*=1.3;}
    if(owner.ai==='flipper'&&G.idx>150)need*=0.9;if(owner.ai==='saver')need*=1.1;need=Math.round(need);
    ok=v>=need;await talk(owner,ok?`${fm(v)} 萬？成交！`:`${fm(v)} 萬太少了，至少要 <b>${fm(need)} 萬</b>才考慮。`,null,{ms:1800});}
  if(ok&&G.tiles[i].o===owner.id&&p.cash>=v){transfer(i,owner,p,v);toast(`${p.name}買下${t.n}`);}}
function raiseHuman(p,amt,why){
  if(liquid(p)<amt)return ask(p,null,`${esc(p.name)}要付 ${fm(amt)} 萬（${esc(why)}），但把所有地產賣掉也湊不出來……`,[{t:'宣告破產'}],{def:0}).then(()=>false);
  return new Promise(res=>{raiseCtx={pid:p.id,amt,why,res};G.raise={pid:p.id,amt,why:String(why)};if(isLocal(p)){mgTab='mine';renderManage();}refresh();push(true);});}

  const rank=G.players.slice().sort((a,b)=>(a.out-b.out)||netWorth(b)-netWorth(a));const w=rank[0];
  const titles=['地產大亨','包租公','小地主','無殼蝸牛'];
  const btns=NET.role==='guest'?`<button class="btn pri" type="button" id="eT">離開房間</button>`:NET.role==='host'?`<button class="btn" type="button" id="eT">解散房間</button><button class="btn pri" type="button" id="eN">同一房間再來一局</button>`:`<button class="btn" type="button" id="eT">回到標題</button><button class="btn pri" type="button" id="eN">再玩一局</button>`;

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}

// 共用的房間：追蹤誰在線、心跳、把訊息分給監聽者
function starRoom(id,isHost){
  const ls={},pc=[],conns=new Map(),seen=new Map(),links=[];
  let me=isHost?id:'tpeg'+rid(),open=false,hb=0,hostSeen=0,hostGone=false,guestLink=null;
  const P=x=>({peer:x,sameTab:x===me,isMe:x===me,by:null,kind:'viewer',guest:false,presence:{},updatedAt:0});
  const list=()=>[me,...(isHost?[...conns.keys()]:(open?[id]:[]))].map(P);
  const firePeers=(j,l)=>{const ch={peers:list(),joined:j?[P(j)]:[],left:l?[P(l)]:[],updated:[]};pc.forEach(h=>{try{h(ch);}catch(e){console.error(e);}});};
  const dispatch=(from,m)=>{(ls[m.t]||[]).forEach(h=>{try{h({topic:m.t,data:m.d,peer:from,by:null,isMe:from===me,sameTab:from===me,kind:'viewer',guest:false});}catch(e){console.error(e);}});};
  const recv=(from,m,link)=>{if(!m||typeof m!=='object')return;const now=Date.now();
    if(isHost){if(from===me)return;seen.set(from,now);if(!conns.has(from)){if(conns.size>=12)return;conns.set(from,link);firePeers(from,null);if(link&&link.ping)link.ping();}}
    else{if(from!==id)return;hostSeen=now;if(hostGone){hostGone=false;open=true;firePeers(id,null);}}
    if(typeof m.t==='string'&&m.t!=='__p')dispatch(from,m);};
  const drop=from=>{if(conns.delete(from))firePeers(null,from);};
  const room={name:id,
    emit:async(topic,data)=>{const m={t:topic,d:data};
      if(isHost)links.forEach(l=>{try{l.bcast(m);}catch(e){}});
      else if(guestLink&&open){try{guestLink.send(m);}catch(e){}}else return;
      setTimeout(()=>dispatch(me,m),0);},
    on:(t,h)=>{(ls[t]=ls[t]||[]).push(h);return()=>{ls[t]=(ls[t]||[]).filter(x=>x!==h);};},
    onPeers:h=>{pc.push(h);setTimeout(()=>h({peers:list(),joined:list(),left:[],updated:[]}),0);return()=>{const k=pc.indexOf(h);if(k>=0)pc.splice(k,1);};},
    peers:list,presence:async()=>{},connected:()=>open,onConnection:()=>()=>{},
    leave:async()=>{open=false;clearInterval(hb);removeEventListener('pagehide',bye);links.concat(guestLink?[guestLink]:[]).forEach(l=>{try{l.close();}catch(e){}});}};
  const bye=()=>{room.leave();};addEventListener('pagehide',bye);
  // 心跳：每 2 秒互相確認，超過 10 秒沒消息就當作斷線
  hb=setInterval(()=>{const now=Date.now();
    if(isHost){links.forEach(l=>{try{l.bcast({t:'__p'});}catch(e){}});for(const k of [...conns.keys()])if(now-(seen.get(k)||now)>10000)drop(k);}
    else if(guestLink&&open){try{guestLink.send({t:'__p'});}catch(e){}if(hostSeen&&now-hostSeen>10000&&!hostGone){hostGone=true;open=false;firePeers(null,id);}}},2000);
  return{room,recv,drop,links,me:()=>me,setMe:v=>{me=v;},setGuestLink:l=>{guestLink=l;},setOpen:()=>{open=true;hostSeen=Date.now();}};}
// MQTT：房主收 /h、廣播 /g；加入者收 /g、送 /h
const mqttTopic=id=>'tpegame/v1/'+id;
function mqttConnect(){return window.mqtt.connect(MQTT_URL,{clientId:'tpe_'+rid(),clean:true,connectTimeout:6000,reconnectPeriod:2000});}
function mqttHost(S,id){return new Promise((res,rej)=>{const T=mqttTopic(id);let c;try{c=mqttConnect();}catch(e){rej('err');return;}let ok=false,checking=false;
  const end=r=>{try{c.end(true);}catch(e){}rej(r);};const tm=setTimeout(()=>{if(!ok)end('timeout');},9000);c.on('error',()=>{});
  c.on('connect',()=>{if(ok||checking)return;checking=true;
    c.subscribe([T+'/g',T+'/h'],{qos:0},err=>{if(err){clearTimeout(tm);end('err');return;}
      let taken=false;const chk=(tp,buf)=>{if(tp===T+'/g'){try{const m=JSON.parse(buf);if(m&&m.f===id)taken=true;}catch(e){}}};c.on('message',chk);
      setTimeout(()=>{c.removeListener('message',chk);clearTimeout(tm);if(taken){end('id_taken');return;} // 確認這組代碼沒有別的房主在用
        c.unsubscribe(T+'/g');ok=true;
        const link={kind:'mqtt',bcast:m=>c.publish(T+'/g',JSON.stringify({f:id,t:m.t,d:m.d}),{qos:0}),ping:()=>link.bcast({t:'__p'}),close:()=>{try{c.end(true);}catch(e){}}};
        c.on('message',(tp,buf)=>{if(tp!==T+'/h')return;let m;try{m=JSON.parse(buf);}catch(e){return;}if(!m||typeof m.f!=='string'||m.f.length>40||m.f===id)return;S.recv(m.f,m,link);});
        res(link);},2200);});});});}
function mqttGuest(S,id){return new Promise((res,rej)=>{const T=mqttTopic(id),me=S.me();let c;try{c=mqttConnect();}catch(e){rej('err');return;}let ok=false,hi=0;
  const tm=setTimeout(()=>{if(!ok){clearInterval(hi);try{c.end(true);}catch(e){}rej('not_found');}},9000);c.on('error',()=>{});
  const link={kind:'mqtt',send:m=>c.publish(T+'/h',JSON.stringify({f:me,t:m.t,d:m.d}),{qos:1}),close:()=>{clearInterval(hi);try{c.end(true);}catch(e){}}};
  c.on('connect',()=>{c.subscribe(T+'/g',{qos:0},err=>{if(err)return;const hello=()=>{if(!ok)c.publish(T+'/h',JSON.stringify({f:me,t:'__p'}),{qos:0});};hello();clearInterval(hi);hi=setInterval(hello,1500);});});
  c.on('message',(tp,buf)=>{let m;try{m=JSON.parse(buf);}catch(e){return;}if(!m||m.f!==id)return;if(!ok){ok=true;clearTimeout(tm);clearInterval(hi);res(link);}S.recv(id,m,link);});});}

function peerHost(S,id){return new Promise((res,rej)=>{let peer;try{peer=new window.Peer(id,PEER_OPTS);}catch(e){rej('err');return;}const pcs=new Map();let opened=false;const tm=setTimeout(()=>{try{peer.destroy();}catch(e){}rej('timeout');},10000);

    ${L.seats.map(row).join('')}${spect?`<p class="note">另有 ${spect} 人在房間裡觀戰（座位滿了）。</p>`:''}
    <p style="margin:10px 0 6px"><b>遊戲長度</b></p><div class="seg" id="segR" style="display:inline-flex">${[[12,'12 回合'],[20,'20 回合'],[0,'不限']].map(([v,l])=>`<button type="button" data-v="${v}" class="${L.rounds===v?'on':''}">${l}</button>`).join('')}</div>
    <p class="note" style="margin-top:10px">每位線上玩家用自己的裝置操作。你這台是房主，負責跑遊戲，遊戲中請不要關掉頁面。</p></div>
    <div class="bf"><button class="btn" type="button" id="nLeave">解散房間</button><button class="btn pri" type="button" id="nStart">開始</button></div>`);
  $('#modal').dataset.lock='1';
  if($('#nCopy'))$('#nCopy').onclick=async()=>{const url=$('#nLink').value;try{if(navigator.share){await navigator.share({title:'地產大亨 PK',text:`來玩地產大亨！房間代碼 ${NET.code.toUpperCase()}`,url});return;}await navigator.clipboard.writeText(url);toast('已複製邀請連結',true);}catch(e){$('#nLink').select();}};
  $('#box').querySelectorAll('[data-face]').forEach(c=>drawFace(c,c.dataset.face));
  $('#box').querySelectorAll('.seat .seg').forEach(sg=>sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=L.seats[+sg.dataset.k];s.t=b.dataset.v;if(s.t!=='n'){s.peer='';s.name='';}hostAssign();hostLobbyUI();bcastLobby();});
  $('#segR').onclick=e=>{const b=e.target.closest('button');if(!b)return;L.rounds=+b.dataset.v;hostLobbyUI();bcastLobby();};
  $('#nLeave').onclick=()=>{$('#modal').dataset.lock='';closeModal();toTitle();};
  $('#nStart').onclick=()=>{const on=L.seats.filter(s=>s.t!=='o');if(on.length<2){toast('至少要兩位玩家',true);return;}if(L.seats.some(s=>s.t==='n'&&!s.peer)){toast('還有線上座位沒人加入，改成電腦或不參加',true);return;}netStartGame();};
}
function netStartGame(){const L=NET.lobby;
  const seats=L.seats.map((s,k)=>({on:s.t!=='o',name:k===0?NET.nick:s.t==='a'?SEATS[k].name:s.name,look:s.t==='a'?SEATS[k].look:HUMAN_LOOK[k],col:SEATS[k].col,veh:SEATS[k].veh,vn:SEATS[k].vn,ai:SEATS[k].ai,human:s.t!=='a',net:s.t==='n',peer:s.t==='h'?NET.myPeer:s.peer}));
  $('#modal').dataset.lock='';closeModal();NET.phase='game';newGame({seats,rounds:L.rounds,net:true});enterGame();}
function hostBackToLobby(){clearBoard();$('#hud').hidden=true;$('#title').hidden=false;NET.phase='lobby';hostAssign();hostLobbyUI();bcastLobby();}
function hostHi(peer,nick){nick=cleanNick(nick);NET.cands.set(peer,nick);
  if(NET.phase==='lobby'){hostAssign();hostLobbyUI();bcastLobby();return;}
  if(!G||G.over)return;if(G.players.some(p=>p.peer===peer))return;
  const p=G.players.find(q=>q.net&&!q.out&&(q.offline||q.bot)&&q.name===nick);
  if(p){p.peer=peer;p.offline=false;p.bot=false;clearTimeout(NET.offT[p.id]);toast(`${p.name}回來了`);addNews(`${p.name}重新連線`);refresh();}
  push(true);}
function botTakeover(p){if(!G||!p.offline||p.bot||p.out)return;p.bot=true;addNews(`${p.name}斷線，由電腦代打`);toast(`${p.name}斷線太久，先由電腦代打`);
  if(G.ask&&G.ask.pid===p.id&&NET.askDef)NET.askDef();
  if(G.wait&&G.wait.pid===p.id&&waitBtn)resolveWait();
  if(raiseCtx&&raiseCtx.pid===p.id){const r=raiseCtx;raiseCtx=null;G.raise=null;r.res(aiRaise(p,r.amt));}
  refresh();}
async function hostIntent(peer,d){if(!G||G.over)return;const p=G.players.find(q=>q.net&&!q.bot&&!q.out&&q.peer===peer);if(!p)return;
  const a=String(d.a||''),i=Math.round(+d.i||0);
  if(a==='ans'){if(G.ask&&G.ask.pid===p.id&&G.ask.id===d.id&&NET.askRes)NET.askRes(Math.round(+d.c),d.v==null?null:Math.round(+d.v));return;}
  if(a==='pay'||a==='bk'){if(raiseCtx&&raiseCtx.pid===p.id){if(a==='pay'&&p.cash<raiseCtx.amt)return;const r=raiseCtx;raiseCtx=null;G.raise=null;r.res(a==='pay');}return;}
  const myTurn=!!(G.wait&&G.wait.pid===p.id&&waitBtn&&!busy&&!G.ask),raising=!!(raiseCtx&&raiseCtx.pid===p.id);
  if(a==='roll'||a==='end'){if(myTurn&&G.wait.kind===a&&d.w===G.wait.id)resolveWait();return;}
  if(!(myTurn||raising)||!(i>=0&&i<NT))return;
  else if(a==='ln'){if(canLoan(p,i))doLoan(p,i);}
  else if(a==='rp'){if(!raising&&G.tiles[i].o===p.id&&G.tiles[i].d)doRepay(p,i);}
  else if(a==='sb'){if(canSellB(p,i))doSellB(p,i);}
  else if(a==='m'){if(canMort(p,i))doMort(p,i);}
  else if(a==='r'){if(!raising&&G.tiles[i].o===p.id&&G.tiles[i].m&&p.cash>=redeemCost(i))doRedeem(p,i);}
  else if(a==='s'){if(canSellLand(p,i)&&sellVal(i)>0)doSellLand(p,i);}
  else if(!raising&&a==='o'){const v=Math.round(+d.v||0),st=G.tiles[i];if(v>0&&v<=p.cash&&st.o>=0&&st.o!==p.id&&!G.players[st.o].out&&!groupBuilt(i))await busyRun(()=>tradeOffer(p,G.players[st.o],i,v));}
  else if(!raising&&a==='tk'){if(canTakeover(p,i)&&p.cash>=tkPrice(p,i)*1.1)await busyRun(()=>takeover(p,i));}
  else if(!raising&&a==='au'){if(canAuctionOwn(p,i))await busyRun(()=>auction(i,r10(priceOf(i)*0.6),p,'公開拍賣'));}
  push(true);}

/* 加入者 */
function netStat(msg,err){const s=$('#nStat');if(s){s.textContent=msg;s.className='nstat'+(err?' err':'');}else toast(msg,true);}
async function netJoin(code,nick){
  code=String(code||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(code.length!==5){netStat('代碼是五個英文字母或數字，請再確認一次。',true);return;}
  const api=await roomApi();if(!api){netStat('連線元件載入失敗，請確認網路後重新整理。',true);return;}
  const btn=$('#nJoin');if(btn)btn.disabled=true;
  netStat('正在連線房間…（透過中繼伺服器）');
  let room;try{room=await joinRoom(api,'dcdh-'+code,false,k=>{if(k==='peer')netStat('中繼伺服器沒找到房間，改試點對點連線…');});}
  catch(e){if(btn)btn.disabled=false;netStat(e&&e.code==='not_found'?'找不到這個房間。請確認：① 代碼正確；② 你和房主打開的是同一個網址；③ 房主的遊戲頁面正開在前景（手機切到其他 App 太久，連線會暫停）。確認後再按一次「加入房間」。':'加入失敗：'+(e&&e.code||'請稍後再試'),true);return;}
  NET.inviteCode=null;if(G)clearBoard();
  Object.assign(NET,{role:'guest',room,code,phase:'lobby',seat:-1,nick,lastSeq:0,lastE:'',lastAt:0,hostPeer:'',lobbyView:null,spectate:false});
  netListen();room.presence({nick}).catch(()=>{});
  const hi=()=>{if(NET.role!=='guest'||NET.spectate)return;if(NET.seat<0)NET.room.emit('lt',{k:'hi',nick:NET.nick}).catch(e=>{if(e&&e.code==='not_permitted'){NET.spectate=true;guestLobbyUI();}});};
  hi();NET.hb=setInterval(()=>{hi();if(G)renderStat();if(NET.phase==='lobby'&&!NET.lobbyView)guestLobbyUI();},3000);
  renderNetChip();guestLobbyUI();
}
function guestLobbyUI(){if(NET.role!=='guest'||NET.phase!=='lobby')return;const lv=NET.lobbyView;
  const rows=lv?lv.seats.map((s,k)=>s.t==='o'?'':`<div class="seat"><canvas width="96" height="96" data-face="${s.t==='a'?SEATS[k].look:HUMAN_LOOK[k]}"></canvas><div><b>${s.t==='n'&&!s.p?'<span class="note">空位，等人加入</span>':esc(cleanNick(s.n))}${s.p&&s.p===NET.myPeer?'（你）':''}</b><div class="note">${s.t==='h'?'房主':s.t==='a'?'電腦':'線上玩家'}</div></div><span></span></div>`).join(''):'';
  const msg=NET.spectate?'你的權限只能觀戰：可以看大家怎麼玩，但不能入座操作。':!lv?'正在找房間……如果一直沒有回應，請確認代碼，或請房主確認他還開著房間頁面。':NET.seat>=0?'已經入座，等房主按「開始」。':'等房主幫你安排座位……（座位滿了的話，會變成觀戰）';
  openModal(`<div class="bh"><h3>房間 ${esc(NET.code.toUpperCase())}</h3></div><div class="bb">${rows}<p class="note">${msg}</p></div><div class="bf"><button class="btn" type="button" id="nLeave">離開房間</button></div>`);
  $('#modal').dataset.lock='1';$('#box').querySelectorAll('[data-face]').forEach(c=>drawFace(c,c.dataset.face));
  $('#nLeave').onclick=()=>{$('#modal').dataset.lock='';closeModal();toTitle();};}
function guestLobby(d){if(!Array.isArray(d.seats))return;
  if(NET.phase==='game'){if(G&&!G.over)return;clearBoard();$('#hud').hidden=true;$('#title').hidden=false;NET.phase='lobby';NET.lastSeq=0;}
  NET.lobbyView={seats:d.seats.slice(0,4).map(s=>({t:['h','n','a','o'].includes(s&&s.t)?s.t:'o',n:String(s&&s.n||''),p:String(s&&s.p||'')}))};
  NET.seat=NET.lobbyView.seats.findIndex(s=>s.p&&s.p===NET.myPeer);guestLobbyUI();}
const vis=[];
function guestEnter(){NET.phase='game';$('#modal').dataset.lock='';closeModal();$('#title').hidden=true;$('#hud').hidden=false;camS.auto=0;camS.pitch=0.92;camS.dist=30;overview=false;
  restoreVisuals();G.players.forEach(p=>{vis[p.id]={pos:p.pos,jail:p.jail,busy:false};});renderNetChip();guestUI();}
function findPath(a,b){for(const d of [1,-1]){let fr=[[a]];for(let s=0;s<14;s++){const nx=[];for(const path of fr){const q=path[path.length-1];const opts=[stepPos(q,d)];const jb=junctionAt(q,d);if(jb)opts.push(d>0?jb.tiles[0]:jb.tiles[jb.tiles.length-1]);
      for(const o of opts){const np=path.concat([o]);if(o===b)return np;nx.push(np);}}fr=nx.slice(0,64);}}return null;}
async function walkVis(id){const v=vis[id],t=tokens[id];if(!v||!t||v.busy)return;v.busy=true;
  try{for(let guard=0;guard<20;guard++){const p=G&&G.players[id];if(!p||(v.pos===p.pos&&!!v.jail===!!p.jail))break;
      const path=!p.jail&&!v.jail?findPath(v.pos,p.pos):null;
      if(!path){const from=t.position.clone();v.pos=p.pos;v.jail=p.jail;const to=p.jail?jailPos(p):tokenPos(p);await tween(0.7,k=>{t.position.lerpVectors(from,to,k);t.position.y=to.y+Math.sin(k*Math.PI)*4;});t.rotation.y=faceRy(p.pos,p.dir||1);}
      else for(const q of path.slice(1)){const from=t.position.clone();v.pos=q;const to=tokenPos(p,q);const ry=Math.atan2(to.x-from.x,to.z-from.z);snd('step');await tween(0.17,k=>{t.position.lerpVectors(from,to,k);t.position.y=to.y+Math.sin(k*Math.PI)*0.7;t.rotation.y=ry;});}
      focusOn(t.position);}}
  finally{v.busy=false;}}
function applySnap(S){
  if(typeof S.s!=='number')return;
  if(S.e===NET.lastE&&S.s<=NET.lastSeq)return;
  const fresh=S.e!==NET.lastE;NET.lastE=S.e;NET.lastSeq=S.s;NET.lastAt=Date.now();
  const nG=unpack(S);if(!nG)return;const old=G;
  if(fresh||!old||NET.phase!=='game'||old.players.length!==nG.players.length){if(old)clearBoard();G=nG;NET.seat=G.players.findIndex(p=>p.net&&p.peer&&p.peer===NET.myPeer);guestEnter();if(G.over)endGame();return;}
  G=nG;NET.seat=G.players.findIndex(p=>p.net&&p.peer&&p.peer===NET.myPeer);
  const newEv=(G.evDone||[]).filter(k=>!(old.evDone||[]).includes(k)&&TL[k]&&!TL[k].era);if(newEv.length&&!(G.era>old.era)){const k=newEv[newEv.length-1];if(!mgOpen&&!(G.ask&&G.ask.pid===NET.seat)&&$('#modal').hidden){openModal(newsHTML(k));$('#eraOk').onclick=closeModal;}else toast('時事快報：'+TL[k].h,true);}
  const eraUp=G.era>old.era;if(eraUp){applyEraVisuals(true);T.forEach((t,i)=>drawTile(i));const e=G.era;showcase(e).then(()=>{if(!G)return;if(!mgOpen&&!(G.ask&&G.ask.pid===NET.seat)&&$('#modal').hidden){openModal(eraHTML(e));$('#eraOk').onclick=closeModal;}else toast('號外：'+ERA[e].h,true);});}
  const idxCh=old.idx!==G.idx||JSON.stringify(old.gm)!==JSON.stringify(G.gm)||JSON.stringify(old.fx)!==JSON.stringify(G.fx)||JSON.stringify(old.mrt)!==JSON.stringify(G.mrt);
  G.tiles.forEach((s,i)=>{const o=old.tiles[i];if(o.o!==s.o||o.l!==s.l||o.m!==s.m){drawTile(i);setBuilding(i,s.o!==o.o||s.l>o.l);if(s.l>o.l)snd('build');}else if(idxCh&&BUYABLE(T[i]))drawTile(i);});
  if(old.pot!==G.pot||old.fore.length!==G.fore.length)drawSpecials();
  G.players.forEach(p=>{const o=old.players[p.id];const d=p.cash-o.cash;if(d){fly(p,d);snd(d>0?'coin':'pay');}if(p.out&&!o.out){tokens[p.id].visible=false;labels[p.id].style.display='none';}walkVis(p.id);});
  if(JSON.stringify(old.news)!==JSON.stringify(G.news))renderMarquee();
  renderPlayers();renderTicker();renderStat();renderAuc();renderJobs();guestUI();
  if(G.over&&!old.over){setBtns({});hideTalk();endGame();}}
function guestUI(){if(NET.role!=='guest'||!G||G.over)return;const me=NET.seat,now=Date.now();
  const myWait=G.wait&&G.wait.pid===me&&!G.ask&&!G.raise&&!G.auc;
  if(myWait&&(NET.sentW!==G.wait.id||now-NET.sentAt>3000))setBtns({roll:G.wait.kind==='roll',end:G.wait.kind==='end',manage:true});else setBtns({});
  if(G.ask&&G.ask.pid===me){if(NET.askShown!==G.ask.id||(NET.askSent===G.ask.id&&now-NET.sentAt>3000))showAsk(G.ask);}
  else if(NET.askShown){NET.askShown=0;hideTalk();}
  if(G.raise&&G.raise.pid===me){if(!mgOpen&&now-NET.raiseSent>3000){mgTab='mine';renderManage();}}
  if(mgOpen){if(!canManage())closeModal();else{const key=JSON.stringify([G.tiles,G.players.map(q=>q.cash),G.raise,G.tk,G.idx]);if(key!==mgKey){mgKey=key;const sc=$('.bb')?$('.bb').scrollTop:0;renderManage();if($('.bb'))$('.bb').scrollTop=sc;}}}}
function showAsk(a){NET.askShown=a.id;NET.askSent=0;clearTimeout(NET.talkT);const who=a.w>=0?G.players[a.w]:null;
  talkShow(who,safeHTML(a.x),a.c.map(c=>({t:safeHTML(c.t),pri:!!c.p,dis:!!c.d})),{sel:a.s,sk:a.sk}).then(k=>{
    sendIntent({a:'ans',id:a.id,c:k,v:a.s?lastSel:null});NET.askSent=a.id;NET.sentAt=Date.now();
    $('#dlgCh').querySelectorAll('button,select').forEach(b=>b.disabled=true);});}
function guestBtn(kind){if(!G||!G.wait||G.wait.pid!==NET.seat||G.wait.kind!==kind)return;sendIntent({a:kind,w:G.wait.id});NET.sentW=G.wait.id;NET.sentAt=Date.now();setBtns({});}
function guestTalk(d){if(!G||NET.phase!=='game')return;if(G.ask&&G.ask.pid===NET.seat)return;
  const ms=clamp(+d.ms||1500,500,4000),who=d.w>=0&&d.w<G.players.length?G.players[d.w]:null;
  talkShow(who,safeHTML(d.x),null,{ms});clearTimeout(NET.talkT);NET.talkT=setTimeout(()=>{if(!(G&&G.ask&&G.ask.pid===NET.seat))hideTalk();},ms*1.5+900);}
function onNetMsg(m){const d=m.data;if(m.sameTab){NET.myPeer=m.peer;return;}if(!d||typeof d!=='object')return;
  if(NET.role==='host'){if(d.k==='hi')hostHi(m.peer,d.nick);else if(d.k==='i')hostIntent(m.peer,d).catch(e=>console.error(e));return;}
  if(NET.role!=='guest')return;
  if(d.k==='lb'||d.k==='s'){if(!NET.hostPeer)NET.hostPeer=m.peer;}
  if(m.peer!==NET.hostPeer)return;
  if(d.k==='lb')guestLobby(d);
  else if(d.k==='s')applySnap(d);
  else if(d.k==='t')guestTalk(d);
  else if(d.k==='to'){if(NET.phase==='game')toast(String(d.s||'').slice(0,80),true);}
  else if(d.k==='d'){if(NET.phase!=='game')return;const a=clamp(d.a|0,1,6),b=clamp(d.b|0,1,6);rollDice([a,b]);clearTimeout(NET.diceT);NET.diceT=setTimeout(()=>dice.forEach(x=>x.position.y=-5),4500);}
  else if(d.k==='hd'){dice.forEach(x=>x.position.y=-5);}}
function onNetPeers(ch){const me=ch.peers.find(x=>x.sameTab);if(me)NET.myPeer=me.peer;
  if(NET.role==='host'){
    if(NET.phase==='lobby'){if(ch.left.length||ch.joined.length){hostAssign();hostLobbyUI();bcastLobby();}return;}
    if(!G||G.over)return;
    for(const l of ch.left){const p=G.players.find(q=>q.net&&q.peer===l.peer&&!q.out);if(p&&!p.offline){p.offline=true;toast(`${p.name}斷線了，等他回來…`);refresh();clearTimeout(NET.offT[p.id]);NET.offT[p.id]=setTimeout(()=>botTakeover(p),25000);}}
    for(const j of ch.joined){const p=G.players.find(q=>q.net&&q.peer===j.peer&&!q.out);if(p&&(p.offline||p.bot)){p.offline=false;p.bot=false;clearTimeout(NET.offT[p.id]);toast(`${p.name}回來了`);refresh();}}
    if(ch.joined.length)push(true);}
  else if(NET.role==='guest'&&NET.hostPeer&&ch.left.some(x=>x.peer===NET.hostPeer)){toast('房主離開了房間',true);}}

/* ---------- 主迴圈 ---------- */
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?52:38;cam.updateProjectionMatrix();}
addEventListener('resize',resize);
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;
  for(let k=anims.length-1;k>=0;k--){const a=anims[k];a.t+=dt*spd();const v=Math.min(1,a.t/a.d);a.f(v);if(v>=1){anims.splice(k,1);a.res&&a.res();}}
  if(G){const p=curP();if(p&&!overview&&!anims.length&&tokens[p.id]){const tp=tokens[p.id].position;camS.goal.set(tp.x*0.55,0.8,tp.z*0.55);}}
  if(trainM)trainM.position.x=Math.sin(now*0.00016)*(HALF+4);
  updBranch(dt);
  updateCam(dt);R.render(scene,cam);
  if(G){const r=cv.getBoundingClientRect();G.players.forEach(p=>{const t=tokens[p.id],l=labels[p.id];if(!t||!l||p.out)return;const v=t.position.clone();v.y+=1.9;v.project(cam);l.style.transform=`translate(${(v.x+1)/2*r.width-l.offsetWidth/2}px,${(1-v.y)/2*r.height-12}px)`;l.style.outline=p.id===G.cur?'2px solid #ffb000':'none';});
    mqX-=dt*60;const mq=$('#mqIn');if(mq.offsetWidth&&mqX<-mq.offsetWidth)mqX=r.width;mq.style.transform=`translateX(${mqX}px)`;}
}

/* ---------- 啟動 ---------- */
buildWorld();buildBoard();drawLED();resize();
camS.auto=0.08;camS.dist=46;camS.pitch=0.7;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{SIGN_LIST.forEach(paintSign);ATLAS_TEX.needsUpdate=true;T.forEach((t,i)=>drawTile(i));drawLED();});
$('#bCont').hidden=!LS.get(SAVE_KEY);
{const rc=(new URLSearchParams(location.search).get('room')||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(rc.length===5&&!(window.claude&&window.claude.use)){NET.inviteCode=rc;setTimeout(()=>netMenu(),300);}}
requestAnimationFrame(frame);
})();
