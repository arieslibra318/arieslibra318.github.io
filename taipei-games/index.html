<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台北小遊戲合集</title>
<style>
:root{--paper:#f6eedb;--ink:#2b2622;--accent:#c8402f}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#cdb88f;color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:640px;width:100%}
h1{font-size:32px;margin:0 0 16px}
a.card{display:block;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:16px 18px;margin-bottom:14px;color:inherit;text-decoration:none}
a.card:hover{transform:translateY(-2px)}
a.card b{font-size:22px;color:var(--accent)}
a.card p{margin:6px 0 0;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>台北小遊戲合集</h1>
<a class="card" href="landtycoon/"><b>地產大亨</b><p>1985 到 2025 年的台北 3D 大富翁：56 格主線加平溪、貓空兩條支線，時事年表、房貸、法拍與併購。</p></a>
<a class="card" href="election60/"><b>選戰60天</b><p>60 天的市長選戰模擬：在 2D 城市地圖上跑行程、處理突發事件、規劃政見，贏了可以開啟二週目。</p></a>
</main>
</body>
</html>
